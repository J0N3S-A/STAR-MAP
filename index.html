<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAR-MAP 🌟 </title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="top-bar">
        <div class="logo">
          <svg class="logo-icon" viewBox="0 0 24 24">
  <text x="50%" y="50%" dominant-baseline="central" text-anchor="middle" font-size="18">🌟</text>
</svg>
            <span>STAR MAP</span>
        </div>
        <div class="controls">
            <button id="loginBtn" class="btn-primary" style="padding: 8px 16px; border-radius: 12px; font-size: 14px; cursor: pointer;">Mit Google anmelden</button>
            <button id="logoutBtn" class="btn-cancel" style="padding: 8px 16px; border-radius: 12px; font-size: 14px; cursor: pointer; display: none;">Abmelden</button>
            <label class="switch-container">
                <span>Verbindungsmodus</span>
                <input type="checkbox" id="connectSwitch">
                <span class="slider"></span>
            </label>
        </div>
    </header>

    <main id="mindmap"></main>

    <div class="bubble-basket" id="bubbleBasket" draggable="true">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>
        <span>Neuer Gedanke</span>
    </div>

    <!-- Hauptfenster mit hinzugefügtem Submap-Button -->
    <div class="modal-overlay" id="contentModal">
        <div class="modal-card">
            <div class="modal-header">
                <input type="text" id="bubbleTitleInput" class="editable-title" placeholder="Titel eingeben...">
                <!-- NEU: Submap Button -->
                <button id="openSubmapBtn" class="btn-primary" style="margin-right: 15px; font-size: 13px; padding: 8px 14px; border-radius: 10px;">Submap Öffnen</button>
                <button class="close-btn" id="closeContentModal">&times;</button>
            </div>
            
            <div class="tabs">
                <button class="tab-btn active" data-tab="quickNotesTab">
                    <svg class="tab-icon" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                    Notizen
                </button>
                <button class="tab-btn" data-tab="notebooksTab">
                    <svg class="tab-icon" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg>
                    Notizbücher
                </button>
                <button class="tab-btn" data-tab="audiosTab">
                    <svg class="tab-icon" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg>
                    Audio
                </button>
                <button class="tab-btn" data-tab="photosTab">
                    <svg class="tab-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                    Bilder
                </button>
            </div>

            <div class="modal-body">
                <div class="tab-content active" id="quickNotesTab">
                    <button class="add-item-btn" id="addQuickNoteBtn">+ Neue Notiz</button>
                    <div class="items-list" id="quickNotesList"></div>
                </div>

                <div class="tab-content" id="notebooksTab">
                    <button class="add-item-btn" id="addNotebookBtn">+ Neues Notizbuch</button>
                    <div class="items-list" id="notebooksList"></div>
                </div>

                <div class="tab-content" id="audiosTab">
                    <div class="items-list" id="audiosList"></div>
                </div>

                <div class="tab-content" id="photosTab">
                    <label class="upload-btn">
                        <span>Bild hinzufügen</span>
                        <input type="file" id="imageInput" accept="image/*" capture="environment" hidden>
                    </label>
                    <div class="photos-grid" id="photosList"></div>
                </div>
            </div>

            <div class="modal-footer">
                <button class="delete-btn" id="deleteBubbleBtn">Element löschen</button>
            </div>
        </div>
    </div>

    <!-- Notizbuchfenster -->
    <div class="modal-overlay" id="notebookModal" style="z-index: 110;">
        <div class="modal-card notebook-card">
            <div class="modal-header">
            <div class="notebook-header-controls">
                    <div class="notebook-header-actions">
                     <button id="starBtn" class="page-btn" title="Seite markieren" aria-label="Seite markieren" style="color: rgb(138, 157, 147); opacity: 0.6;">⭐</button>
                        
                <div class="format-toolbar header-format-toolbar" data-toolbar-for="notebookPageInput" aria-label="Textformatierung">
                    <button type="button" class="format-menu-toggle" title="Textformatierung" aria-label="Textformatierung" aria-expanded="false">Aa</button>
                    <div class="format-tools">
                        <section class="format-view active" data-format-view="main" aria-label="Formatierungsmenü">
                            <button type="button" class="format-view-option" data-view-target="colors">Farben</button>
                            <button type="button" class="format-view-option" data-view-target="fonts">Schriftarten</button>
                            <button type="button" class="format-view-option" data-view-target="empty" aria-label="Weitere Optionen">⋯</button>
                        </section>
                        <section class="format-view color-format-view" data-format-view="colors" aria-label="Farbauswahl" hidden="">
                            <div class="format-view-heading">
                                <button type="button" class="format-back-btn" data-view-target="main">← Zurück</button>
                                <strong>Farben</strong>
                            </div>
                            <div class="color-picker-layout">
                                <div class="color-picker-column">
                                    <label for="notebookColorPicker">Farbton auswählen</label>
                                    <input id="notebookColorPicker" class="hsl-color-picker" type="color" value="#fe019a" aria-label="Farbe auswählen">
                                </div>
                                <div class="color-fields-column">
                                    <label for="currentColorHex">Aktueller HEX-Code</label>
                                    <div class="hex-copy-row">
                                        <input id="currentColorHex" class="current-color-hex" type="text" readonly="" aria-label="Aktueller HEX-Code">
                                        <button type="button" class="copy-hex-btn" aria-label="HEX-Code kopieren" title="HEX-Code kopieren">Kopieren</button>
                                    </div>
                                    <label for="manualColorHex">HEX-Code eingeben</label>
                                    <input id="manualColorHex" class="manual-color-hex" type="text" inputmode="text" maxlength="7" placeholder="#FF5733" aria-label="HEX-Code eingeben">
                                </div>
                                <div class="color-palette-column">
                                    <span>Standardfarben</span>
                                    <div class="color-swatches" aria-label="Standardfarben"><button type="button" class="color-swatch selected" data-color="#fe019a" style="background:#fe019a" aria-label="Standardfarbe #fe019a" aria-pressed="true"></button><button type="button" class="color-swatch" data-color="#000000" style="background:#000000" aria-label="Standardfarbe #000000" aria-pressed="false"></button><button type="button" class="color-swatch" data-color="#8000f8" style="background:#8000f8" aria-label="Standardfarbe #8000f8" aria-pressed="false"></button><button type="button" class="color-swatch" data-color="#0400f8" style="background:#0400f8" aria-label="Standardfarbe #0400f8" aria-pressed="false"></button></div>
                                    <span>Zuletzt verwendet</span>
                                    <div class="custom-colors" aria-label="Zuletzt verwendete Farben"><button type="button" class="color-swatch" data-color="#8E4370" style="background:#8E4370" aria-label="Farbe #8E4370" aria-pressed="false"></button><button type="button" class="color-swatch selected" data-color="#FE019A" style="background:#FE019A" aria-label="Farbe #FE019A" aria-pressed="true"></button><button type="button" class="color-swatch" data-color="#0400F8" style="background:#0400F8" aria-label="Farbe #0400F8" aria-pressed="false"></button><button type="button" class="color-swatch" data-color="#000000" style="background:#000000" aria-label="Farbe #000000" aria-pressed="false"></button></div>
                                </div>
                            </div>
                            <div class="format-view-footer">
                                <button type="button" class="confirm-color-btn">✔ Bestätigen</button>
                            </div>
                        </section>
                        <section class="format-view font-format-view" data-format-view="fonts" aria-label="Schriftart und Stil" hidden="">
                            <div class="format-view-heading">
                                <button type="button" class="format-back-btn" data-view-target="main">← Zurück</button>
                                <strong>Schriftarten</strong>
                            </div>
                            <label for="notebookFontSelect">Schriftstil und Schriftart</label>
                            <select id="notebookFontSelect" class="font-format-select" aria-label="Schriftstil und Schriftart">
                                <optgroup label="Textstil">
                                    <option value="block:p">Normal</option>
                                    <option value="block:h2">Überschrift 1</option>
                                    <option value="block:h3">Überschrift 2</option>
                                    <option value="block:h4">Überschrift 3</option>
                                    <option value="block:blockquote">Zitat</option>
                                </optgroup>
                                <optgroup label="Schriftart">
                                    <option value="font:Arial">Arial</option>
                                    <option value="font:Georgia">Georgia</option>
                                    <option value="font:Verdana">Verdana</option>
                                    <option value="font:Trebuchet MS">Trebuchet MS</option>
                                    <option value="font:Courier New">Courier New</option>
                                    <option value="font:Times New Roman">Times New Roman</option>
                                    <option value="font:Plus Jakarta Sans">Plus Jakarta Sans</option>
                                </optgroup>
                            </select>
                            <button type="button" class="format-toggle font-bold-toggle" data-command="bold" aria-pressed="false" title="Fett ein-/ausschalten">B&nbsp; Fett</button>
                        </section>
                        <section class="format-view" data-format-view="empty" aria-label="Weitere Optionen" hidden="">
                            <div class="format-view-heading">
                                <button type="button" class="format-back-btn" data-view-target="main">← Zurück</button>
                            </div>
                        </section>
                    </div>
                </div>
                <h3 id="activeNotebookTitle" class="notebook-title-display">Notizbuch</h3>
            </div>
            <div class="notebook-page-container">
                <div class="editor-with-toolbar">
                    <div id="notebookPageInput" class="notebook-textarea rich-editor" contenteditable="true" data-editor-type="notebook" role="textbox" aria-multiline="true" data-placeholder="Schreibe deine Gedanken hier..."></div>
                </div>
                <div class="page-footer">
                    <button id="prevPageBtn" class="page-btn">&larr; Zurück</button>
                    <span id="pageIndicator" class="page-number">Seite 1</span>
                    <button id="nextPageBtn" class="page-btn">Weiter &rarr;</button>
                </div>
            </div>
        </div>
    </div>

        <!-- Modal قائمة الصفحات -->
    <div class="modal-overlay" id="pagesListModal" style="z-index: 115;">
        <div class="modal-card small-card">
            <h3>📋 Seiten</h3>
            <div id="pagesListContainer" style="max-height: 60vh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;"></div>
        </div>
    </div>

    <!-- Bestätigungsfenster -->
    <div class="modal-overlay danger-zone" id="confirmModal" style="z-index: 120;">
        <div class="modal-card small-card">
            <h3>Sind Sie sicher?</h3>
            <p>Diese Aktion kann nicht rückgängig gemacht werden.</p>
            <div class="confirm-actions">
                <button class="btn-cancel" id="cancelConfirmBtn">Abbrechen</button>
                <button class="btn-danger" id="actionConfirmBtn">Löschen</button>
            </div>
        </div>
    </div>

    <!-- Verschiebefenster -->
    <div class="modal-overlay" id="moveModal" style="z-index: 120;">
        <div class="modal-card small-card">
            <h3>Verschieben nach</h3>
            <select id="targetBubbleSelect" class="styled-select"></select>
            <div class="confirm-actions">
                <button class="btn-cancel" id="cancelMoveBtn">Abbrechen</button>
                <button class="btn-primary" id="actionMoveBtn">Verschieben</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
