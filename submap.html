<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memoiren - Submap</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="top-bar" style="justify-content: flex-start; gap: 20px;">
        <button id="backToMainBtn" class="btn-cancel" style="padding: 8px 16px; border-radius: 12px; font-size: 14px;">&larr; Zurück</button>
        <div class="logo" style="flex-grow: 1;">
            <span id="submapTitleDisplay">Submap</span>
        </div>
        <div class="controls">
            <button id="subLoginBtn" class="btn-primary" style="padding: 8px 16px; border-radius: 12px; font-size: 14px; cursor: pointer;">Mit Google anmelden</button>
            <button id="subLogoutBtn" class="btn-cancel" style="padding: 8px 16px; border-radius: 12px; font-size: 14px; cursor: pointer; display: none;">Abmelden</button>
            <label class="switch-container">
                <span>Verbinden</span>
                <input type="checkbox" id="subConnectSwitch">
                <span class="slider"></span>
            </label>
        </div>
    </header>

    <main id="submindmap"></main>

    <!-- Hinzufügen-Knopf für Submap -->
    <div class="bubble-basket" id="addNodeBasket" style="cursor: pointer;">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>
        <span>Neuer Block</span>
    </div>

    <!-- Editieren Modal für die Submap-Kästchen -->
    <div class="modal-overlay" id="editNodeModal">
        <div class="modal-card small-card" style="max-width: 450px;">
            <div class="modal-header">
                <input type="text" id="nodeTitleInput" class="editable-title" placeholder="Titel eingeben...">
                <div class="format-toolbar header-format-toolbar" data-toolbar-for="nodeTextInput" aria-label="Textformatierung">
                    <button type="button" class="format-menu-toggle" title="Textformatierung" aria-label="Textformatierung">Aa</button>
                    <div class="format-tools">
                        <button type="button" class="format-toggle" data-command="bold" title="Fett" aria-label="Fett">B</button>
                        <div class="color-swatches" aria-label="Standardfarben">
                            <button type="button" class="color-swatch" data-color="#2EC4B6" style="background:#2EC4B6" aria-label="Türkis"></button>
                            <button type="button" class="color-swatch" data-color="#6BBF59" style="background:#6BBF59" aria-label="Grün"></button>
                            <button type="button" class="color-swatch" data-color="#FFFFFF" style="background:#FFFFFF" aria-label="Weiß"></button>
                            <button type="button" class="color-swatch" data-color="#F4D35E" style="background:#F4D35E" aria-label="Gelb"></button>
                        </div>
                        <div class="custom-colors" aria-label="Zuletzt verwendete Farben"></div>
                        <input class="hex-color-input" type="text" inputmode="text" maxlength="7" placeholder="#FF5733" aria-label="Hex-Farbcode">
                        <select data-command="formatBlock" title="Textstil" aria-label="Textstil">
                            <option value="p">Normal</option>
                            <option value="h3">Überschrift</option>
                            <option value="blockquote">Zitat</option>
                        </select>
                    </div>
                </div>
                <button class="close-btn" id="closeEditModal">&times;</button>
            </div>
            <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 15px;">
                <div class="editor-with-toolbar">
                    <div id="nodeTextInput" class="node-text-editor rich-editor" contenteditable="true" data-editor-type="submap-node" role="textbox" aria-multiline="true" data-placeholder="Text hier eingeben..."></div>
                </div>
            </div>
            <div class="confirm-actions">
                <button class="btn-danger" id="deleteNodeBtn">Löschen</button>
                <button class="btn-primary" id="saveNodeBtn">Speichern</button>
            </div>
        </div>
    </div>

    <!-- Bestätigungsfenster für Submap (Löschen von Verbindungen/Blöcken) -->
    <div class="modal-overlay danger-zone" id="confirmSubModal" style="z-index: 120;">
        <div class="modal-card small-card">
            <h3>Sind Sie sicher?</h3>
            <p>Diese Aktion löscht das Element unwiderruflich.</p>
            <div class="confirm-actions">
                <button class="btn-cancel" id="cancelSubConfirmBtn">Abbrechen</button>
                <button class="btn-danger" id="actionSubConfirmBtn">Löschen</button>
            </div>
        </div>
    </div>

    <script type="module" src="submap.js"></script>
</body>
</html>
